<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Senha - um jogo diário de palavras de cinco letras.">
    <title>Senha</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="game">
        <header class="header">
            <h1>SENHA</h1>
            <button id="helpButton" class="icon-button" type="button" aria-label="Como jogar">?</button>
        </header>

        <section id="board" class="board" aria-label="Tabuleiro"></section>

        <section id="message" class="message" aria-live="polite"></section>

        <section id="keyboard" class="keyboard" aria-label="Teclado virtual"></section>

        <section id="stats" class="stats hidden">
        <div>
            <strong id="resultTitle">Você venceu!</strong>
            <span id="answer"></span>
        </div>
    
        <div class="next-game">
            <span>Próximo jogo</span>
            <strong id="countdown">00:00:00</strong>
        </div>
    
        <button id="resetButton" class="reset-button" type="button">
            Resetar jogo
        </button>
    </section>
    </main>

    <div
        id="helpModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="helpTitle"
    >
        <div class="modal-content">
            <button
                id="closeHelpButton"
                class="close-button"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>

            <h2 id="helpTitle">Como jogar</h2>

            <p>Adivinhe a palavra de 5 letras em até 6 tentativas.</p>

            <div class="example">
                <div class="example-tile correct">P</div>
                <p>A letra está na posição correta.</p>
            </div>

            <div class="example">
                <div class="example-tile present">L</div>
                <p>A letra existe, mas está em outra posição.</p>
            </div>

            <div class="example">
                <div class="example-tile absent">X</div>
                <p>A letra não está na palavra.</p>
            </div>
        </div>
    </div>

    <script src="./js/game.js"></script>
</body>
</html>
